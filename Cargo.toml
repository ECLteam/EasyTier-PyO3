[package]
name = "easytier-pyo3"
version = "0.1.2"
edition = "2024"
description = "Python bindings for EasyTier mesh VPN core (PyO3)"
license = "LGPL-3.0"

[lib]
name = "easytier_pyo3"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29"
easytier = { git = "https://github.com/EasyTier/EasyTier.git" }
easytier-core = { git = "https://github.com/EasyTier/EasyTier.git", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
url = "2"
uuid = "1"
serde = "1"
serde_json = "1"
toml = "1"
cidr = "0.3"
# prost-wkt-types 默认构建需要系统 protoc 命令；启用 vendored-protox 改用纯 Rust
# 的 protox 编译，避免在未安装 protoc 的环境下构建失败。
prost-wkt-types = { version = "0.7", features = ["vendored-protox"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
# 仅 Windows：把 pyd 所在目录加入进程 DLL 搜索路径，让 easytier 能找到随包分发的
# wintun.dll（见 src/lib.rs 的 register_pyd_dll_search_dir）。
windows-sys = { version = "0.61", features = ["Win32_System_LibraryLoader"] }
