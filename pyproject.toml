[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "easytier-pyo3"
version = "0.1.2"
description = "Python bindings for EasyTier mesh VPN core (PyO3)"
readme = "README.md"
# 3.9/3.10 无 Windows ARM64 官方构建，全平台最低支持从 3.11 起（与 CI 构建产物对齐）
requires-python = ">=3.11"
license = "LGPL-3.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

[tool.maturin]
bindings = "pyo3"
module-name = "easytier_pyo3"
# python/ 下的 easytier_pyo3 包随 wheel 一起安装，
# 其中携带类型存根与运行时 DLL（wintun.dll / Packet.dll / WinDivert64.sys，
# 由 build.rs 构建时从 third_party/<arch>/ 自动复制，见 build.rs）。
python-source = "python"
# 运行时 DLL 由 build.rs 生成且被 .gitignore 忽略；maturin 默认不会打包
# 被 gitignore 的文件，必须用 include 显式强制打进 wheel，否则安装后
# import 扩展时因缺少 Packet.dll 报 "DLL load failed"（根因见 ADR）。
include = [
  { path = "easytier_pyo3/*.dll", format = "wheel" },
  { path = "easytier_pyo3/*.sys", format = "wheel" }
]

[tool.maturin.sbom]
# 关闭自动生成的 Rust SBOM（cyclonedx.json，约 750KB 原始大小）。
rust = false
