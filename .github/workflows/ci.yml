name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  PROTOC_VERSION: 25.3                        # 统一 protoc 版本
  # macOS runner 网络经代理时拦截 TLS（自签名证书），让 Node.js 使用系统 CA
  NODE_OPTIONS: --use-system-ca
  # 让 cargo 用系统 git 拉取 git 依赖（libgit2 在 macOS 上不信自签 CA 会失败）
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: windows-latest
            arch: x86_64
          - os: macos-13
            arch: x86_64
          - os: macos-14
            arch: arm64
          # Windows ARM64：GitHub-hosted 自托管 preview runner
          - os: windows-11-arm
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      # ---- 安装 protoc（Linux 在 manylinux 容器内安装） ----
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: |
          arch=$(uname -m)
          if [ "$arch" = "arm64" ]; then protoc_arch="osx-aarch_64"; else protoc_arch="osx-x86_64"; fi
          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v${{ env.PROTOC_VERSION }}/protoc-${{ env.PROTOC_VERSION }}-${protoc_arch}.zip" -o /tmp/protoc.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          sudo chmod +x /usr/local/bin/protoc

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 保留官方 zip 的 include/（google/protobuf/*.proto），否则 protoc 报 File not found
          # protoc 官方无独立的 win-arm64 版；arm64 Windows runner 通过 x64 模拟运行 win64 版。
          $url = "https://github.com/protocolbuffers/protobuf/releases/download/v$env:PROTOC_VERSION/protoc-$env:PROTOC_VERSION-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\protoc.zip"
          Expand-Archive -Path "$env:TEMP\protoc.zip" -DestinationPath "$env:TEMP\protoc" -Force
          "PROTOC=$env:TEMP\protoc\bin\protoc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # ---- Windows x64: 缓存并安装 LLVM（bindgen 需要 libclang；choco 仅 x64）----
      - name: Cache LLVM (Windows)
        if: runner.os == 'Windows' && matrix.arch == 'x86_64'
        uses: actions/cache@v4
        id: cache-llvm
        with:
          path: C:\Program Files\LLVM
          key: llvm-windows-${{ hashFiles('.llvm-version') }}   # 可自行在仓库根目录创建 .llvm-version 文件来更新缓存
          restore-keys: |
            llvm-windows-

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows' && matrix.arch == 'x86_64' && steps.cache-llvm.outputs.cache-hit != 'true'
        run: choco install llvm -y --no-progress

      # ---- Windows ARM64: winget 装 LLVM（choco 在 arm64 runner 上可能不可用）----
      - name: Install LLVM (Windows ARM64)
        if: runner.os == 'Windows' && matrix.arch == 'arm64' && runner.arch == 'ARM64'
        shell: pwsh
        run: winget install LLVM.LLVM --accept-package-agreements --accept-source-agreements --silent

      - name: Set LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      # macOS: bindgen(pnet_sys) 需要 libclang，指向 Xcode 工具链自带的 libclang.dylib
      - name: Set LIBCLANG_PATH (macOS)
        if: runner.os == 'macOS'
        run: |
          clang_dir=$(dirname "$(xcrun --find clang)")
          echo "LIBCLANG_PATH=${clang_dir}/../lib" >> $GITHUB_ENV

      # ---- Python 多版本 ----
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.9
            3.10
            3.11
            3.12
            3.13

      # ---- 缓存 cargo 依赖 ----
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # ---- 构建 wheel（一次构建所有 Python 版本） ----
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --find-interpreter
          manylinux: 2_28
          sccache: true
          before-script-linux: |
            # manylinux 容器内安装 protoc
            curl -fsSL https://github.com/protocolbuffers/protobuf/releases/download/v${{ env.PROTOC_VERSION }}/protoc-${{ env.PROTOC_VERSION }}-linux-x86_64.zip -o /tmp/protoc.zip
            unzip -o /tmp/protoc.zip -d /usr/local
            chmod +x /usr/local/bin/protoc
            # bindgen（pnet_sys）需要 libclang；pnet_datalink 需要 libpcap 头文件
            dnf install -y clang libpcap-devel || yum install -y clang libpcap-devel
          docker-options: --env LIBCLANG_PATH=/usr/lib64

      # ---- Windows ARM64: 用 aarch64 的运行时 DLL 替换 python 包内默认（x64）DLL ----
      - name: Stage ARM64 runtime DLLs (Windows ARM64)
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: bash
        run: |
          cp third_party/arm64/Packet.dll third_party/arm64/wintun.dll python/easytier_py/

      # ---- 安装匹配当前 CPython 的 wheel 并运行自测（maturin 无 test 子命令）----
      # 注意：dist/ 下是全部 CPython 版本的 wheel，不能一起 pip install，
      # 否则不匹配版本的 wheel 会报 "not a supported wheel"。
      - name: Install wheel & run tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          wheel=$(python -c "import glob,sys; v='cp%d%d'%(sys.version_info.major,sys.version_info.minor); print(next(w for w in glob.glob('dist/*.whl') if ('-%s-%s-'%(v,v)) in w))")
          python -m pip install "$wheel"
          python tests/test_easytier.py

      # ---- 上传构建产物 ----
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist